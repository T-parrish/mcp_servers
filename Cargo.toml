[package]
name = "bandcamp_mcp_server"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "0.9", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "charset", "http2", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rookie = "0.5.6"
dotenv = "0.15.0"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-rustls", "reqwest-blocking-client", "internal-logs"] }
opentelemetry-semantic-conventions = "0.32.1"
tracing-opentelemetry = { version = "0.33.0", default-features = false, features = ["tracing-log"] }
