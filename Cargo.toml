[workspace]
resolver = "3"
members = ["mcp_core", "mcp_db", "mcp_db/sqlx_shim", "bandcamp_mcp_server", "spotify_mcp_server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Single source of truth for every shared dependency version. Members opt in
# with `<dep>.workspace = true`, so the two servers cannot drift apart and the
# whole workspace compiles them once into the shared `target/`.
[workspace.dependencies]
mcp_core = { path = "mcp_core" }
mcp_db = { path = "mcp_db" }
rmcp = { version = "0.9", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "signal", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "charset", "http2", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dotenv = "0.15.0"
# The `sqlx` facade crate is deliberately not used: it declares an optional
# SQLite backend whose `libsqlite3-sys` version Cargo cannot reconcile with the
# one `rookie` pulls in for the bandcamp server, and `links` conflicts are
# resolved across the whole graph whether or not the feature is enabled.
sqlx-core = { version = "0.9", default-features = false, features = ["migrate", "_rt-tokio"] }
sqlx-postgres = { version = "0.9", default-features = false, features = ["migrate"] }
# `sqlx-macros` on its own has no SQLite backend to declare, so `migrate!` is
# still available to `mcp_db` — via `mcp_db/sqlx_shim`, which supplies the
# `::sqlx::` paths the macro expands to. See that crate's docs.
sqlx-macros = { version = "0.9", default-features = false, features = ["migrate", "postgres", "_rt-tokio"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
rookie = "0.5.6"
url = "2"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-rustls", "reqwest-blocking-client", "internal-logs"] }
opentelemetry-semantic-conventions = "0.32.1"
tracing-opentelemetry = { version = "0.33.0", default-features = false, features = ["tracing-log"] }
